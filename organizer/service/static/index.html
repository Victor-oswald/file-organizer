<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Organizer</title>
<style>
:root{
  --bg:#f0f0f0; --panel:#f7f7f7; --surface:#fff; --line:#d4d4d4; --line2:#e7e7e7; --text:#1d1d1d; --muted:#6b6b6b;
  --accent:#1862c4; --accent-text:#fff; --ok:#1f7a35; --warn:#a85f00; --bad:#c0292b; --info:#4a5b73;
  --hover:#edf2fa; --sel:#dde8f7; --flash:#fff3b8; color-scheme:light;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#1a1a1a; --panel:#202020; --surface:#252525; --line:#3b3b3b; --line2:#303030; --text:#e4e4e4; --muted:#9a9a9a;
  --accent:#4b94f0; --accent-text:#0b0b0b; --ok:#5fbf78; --warn:#e0a040; --bad:#ef7b7b; --info:#93a4bd;
  --hover:#2c3440; --sel:#2a3a52; --flash:#4a4420; color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#1a1a1a; --panel:#202020; --surface:#252525; --line:#3b3b3b; --line2:#303030; --text:#e4e4e4; --muted:#9a9a9a;
    --accent:#4b94f0; --accent-text:#0b0b0b; --ok:#5fbf78; --warn:#e0a040; --bad:#ef7b7b; --info:#93a4bd;
    --hover:#2c3440; --sel:#2a3a52; --flash:#4a4420; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{padding:3px 11px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button:active{background:var(--sel)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.primary:hover{filter:brightness(1.1)}
button.danger{color:var(--bad)}
button[disabled]{opacity:.45;pointer-events:none}
input[type=text],select{padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);min-width:0}
input[type=checkbox]{accent-color:var(--accent);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
/* ---------- toolbar ---------- */
#bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .name{font-weight:650;margin-right:10px}
#bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#bar .grow{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.beat{animation:beat .7s}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.seg{display:inline-flex;align-items:center;gap:7px}
/* ---------- layout ---------- */
#mid{display:grid;grid-template-columns:214px 1fr;min-height:0}
#left{background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
#left h3{margin:0;padding:8px 10px 4px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;border:0;border-radius:0;background:none;width:100%;text-align:left}
.frow:hover{background:var(--hover)}.frow.on{background:var(--sel)}
.frow .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--accent);color:var(--accent-text);border-radius:8px;padding:0 6px;font-size:11px;font-weight:650;min-width:16px;text-align:center}
#left .foot{margin-top:auto;padding:8px 10px;border-top:1px solid var(--line2)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel);padding:0 6px}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:7px 12px;color:var(--muted)}
.tab:hover{color:var(--text);background:none}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
#content{flex:1;min-height:0;overflow:auto}
.tools{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:2}
.tools .grow{flex:1}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:37px;text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line);background:var(--panel);z-index:1}
td{padding:3px 8px;border-bottom:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:hover td{background:var(--hover)}
tr.flash td{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--flash)}}
tr.grp td{background:var(--panel);font-weight:600;border-top:1px solid var(--line);white-space:normal}
td.time{color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-weight:600;font-size:12px}
.t-renamed,.t-moved,.t-undone{color:var(--ok)}.t-proposed{color:var(--accent)}.t-review,.t-duplicate{color:var(--warn)}
.t-error{color:var(--bad)}.t-detected,.t-kept,.t-ignored,.t-skipped,.t-info{color:var(--info)}
.old{color:var(--muted)}.arrow{color:var(--muted);margin:0 5px}.new{font-weight:600}.dir{color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);max-width:64ch}
.empty h2{font-size:15px;color:var(--text);margin:0 0 4px}
.empty p{margin:0 0 10px}
/* ---------- folder settings ---------- */
.props{display:grid;grid-template-columns:190px minmax(0,1fr);max-width:780px;padding:2px 14px 12px}
.props>div{padding:6px 0;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;min-height:32px}
.props>div.k{color:var(--muted)}
.props .hint{color:var(--muted);font-size:12px}
.section{padding:12px 14px 4px;font-weight:650}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}
/* ---------- status bar ---------- */
#status{display:flex;align-items:center;gap:14px;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;min-height:26px}
#status .live{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
#status .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.spin{width:11px;height:11px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* ---------- dialogs ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:4px;width:min(540px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mhead{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:650}
.mbody{padding:12px 14px;overflow:auto}
.mfoot{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel)}
.form{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 10px;align-items:center}
.form .k{color:var(--muted)}
.row2{display:flex;gap:6px}.row2 input{flex:1}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:8px}
.crumbs button{padding:1px 6px}
.dirs{border:1px solid var(--line);height:260px;overflow:auto}
.dirrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:4px 8px}
#toasts{position:fixed;right:10px;bottom:34px;display:grid;gap:6px;z-index:100}
.toast{background:var(--text);color:var(--bg);padding:6px 12px;border-radius:3px;max-width:380px}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:760px){#mid{grid-template-columns:1fr}#left{display:none}.props{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="mid"><nav id="left" aria-label="Folders"></nav><section id="main"><div id="tabs" role="tablist"></div><div id="content"></div></section></div>
<div id="status" role="status"></div>
<div id="modals"></div><div id="toasts" aria-live="polite"></div>
<script>
"use strict";
const TOKEN = "{{TOKEN}}", VERSION = "{{VERSION}}";
const $ = (s) => document.querySelector(s);

/* Safe DOM builder: text is ALWAYS inserted as text (file names can contain anything). */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (["checked", "value", "disabled", "selected"].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  const add = (c) => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c instanceof Node ? c : document.createTextNode(String(c))); };
  kids.forEach(add);
  return el;
}
/* replaceChildren() does NOT flatten arrays or skip null (it would print "null"); put() does both. */
function put(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); }
async function api(path, method = "GET", body) {
  const r = await fetch("/api" + path, { method, headers: { "X-Auth-Token": TOKEN, "Content-Type": "application/json" }, body: body !== undefined ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("Request failed (" + r.status + ")"));
  return data;
}

/* ---------- state ---------- */
const S = { st: null, events: [], lastEvent: 0, flash: new Set(), batches: [], details: {}, sel: {}, open: {}, view: "activity",
            folder: null, filter: "all", q: "", skew: 0, offline: false, sig: "", msg: "", msgUntil: 0, lastBeat: 0 };
const KIND = { detected: "New", proposed: "Awaiting OK", renamed: "Renamed", moved: "Moved", review: "Set aside", duplicate: "Duplicate",
               kept: "Left alone", ignored: "Ignored", skipped: "Skipped", undone: "Undone", error: "Problem", info: "Info" };
const GROUPS = { all: null, changes: ["renamed", "moved", "review", "undone", "proposed"], idle: ["kept", "ignored", "detected", "duplicate", "skipped", "info"], problems: ["error"] };
const nowS = () => Date.now() / 1000 + S.skew;
const base = (p) => p.split(/[\\/]/).filter(Boolean).pop() || p;
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const pct = (c) => Math.round(c * 100) + "%";
function sureness(c) { return c >= .9 ? "very sure" : c >= .75 ? "confident" : c >= .6 ? "fairly sure" : "not sure"; }
function clock(ts) { const d = new Date(ts * 1000); return [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":"); }
function ago(ts) { if (!ts) return "never"; const s = Math.max(0, Math.round(nowS() - ts)); if (s < 2) return "just now"; if (s < 60) return s + "s ago"; if (s < 3600) return Math.round(s / 60) + " min ago"; return Math.round(s / 3600) + " h ago"; }
function pathEl(rel) { const i = rel.lastIndexOf("/"); return [i >= 0 ? h("span", { class: "dir" }, rel.slice(0, i + 1)) : null, rel.slice(i + 1)]; }
function summarize(c) { const p = [];
  if (c.rename) p.push(plural(c.rename, "rename")); if (c.move) p.push(plural(c.move, "move")); if (c.quarantine) p.push(c.quarantine + " set aside");
  if (c.duplicate) p.push(plural(c.duplicate, "duplicate")); if (c.flagged_duplicates) p.push(plural(c.flagged_duplicates, "duplicate") + " found");
  return p.join(", ") || "no changes"; }
function toast(msg, bad) { const t = h("div", { class: "toast" + (bad ? " bad" : "") }, msg); $("#toasts").append(t); setTimeout(() => t.remove(), bad ? 7000 : 2500); }
function note(msg) { S.msg = msg; S.msgUntil = Date.now() + 3500; paintStatus(); }
async function act(fn, ok) { try { const r = await fn(); if (ok) note(typeof ok === "function" ? ok(r) : ok); await poll(); return r; } catch (e) { toast(e.message, true); } }
const folderById = (id) => S.st && S.st.folders.find((f) => f.id === id);

/* ---------- dialogs ---------- */
function modal(title, body, buttons) {
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape" && ov === [...document.querySelectorAll(".overlay")].pop()) close(); };
  const ov = h("div", { class: "overlay", onclick: (e) => { if (e.target === ov) close(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title }, h("div", { class: "mhead" }, title), h("div", { class: "mbody" }, body), h("div", { class: "mfoot" }, buttons(close))));
  document.addEventListener("keydown", esc); $("#modals").append(ov);
  const first = ov.querySelector("input,select"); if (first) first.focus();
  return close;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise((res) => { let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
    modal(title, h("p", { style: "margin:0" }, text), (close) => [h("button", { onclick: () => { fin(false); close(); } }, "Cancel"),
      h("button", { class: danger ? "danger" : "primary", onclick: () => { fin(true); close(); } }, okLabel)]); });
}
function openPicker(start, onPick) {
  const holder = h("div"); let state = null;
  const pickBtn = h("button", { class: "primary", disabled: true, onclick: () => { onPick(state.path); closer(); } }, "Select this folder");
  async function go(path) { try { state = await api("/fs?path=" + encodeURIComponent(path || "")); } catch (e) { toast(e.message, true); return; } draw(); }
  function draw() {
    holder.replaceChildren();
    if (!state.path) {
      holder.append(h("div", { class: "muted", style: "margin-bottom:6px" }, "Start at:"), h("div", { class: "dirs" },
        state.shortcuts.map((s) => h("button", { class: "dirrow", onclick: () => go(s.path) }, s.name, h("span", { class: "muted" }, "   " + s.path))),
        state.drives.map((d) => h("button", { class: "dirrow", onclick: () => go(d) }, "Drive " + d))));
      pickBtn.disabled = true; return;
    }
    const crumbs = [h("button", { onclick: () => go("") }, "Start")];
    state.crumbs.forEach((c) => crumbs.push(h("span", { class: "muted" }, "›"), h("button", { onclick: () => go(c.path) }, c.name)));
    holder.append(h("div", { class: "crumbs" }, crumbs), h("div", { class: "dirs" }, state.dirs.length ? state.dirs.map((d) => h("button", { class: "dirrow", onclick: () => go(d.path) }, d.name)) : h("div", { class: "empty" }, "No sub-folders here.")),
      state.allowed ? null : h("div", { class: "muted", style: "margin-top:6px" }, "This location is too broad or protected. Open a folder inside it."));
    pickBtn.disabled = !state.allowed;
  }
  const closer = modal("Choose a folder", holder, (close) => [h("button", { onclick: close }, "Cancel"), pickBtn]);
  go(start || "");
}

/* ---------- folder options form (shared by Add and Settings) ---------- */
const MODES = [["ask", "Ask me first, then apply"], ["auto", "Apply automatically"]];
const CARES = [["cautious", "Cautious (rename only when very sure)"], ["balanced", "Balanced"], ["eager", "Eager (rename more files)"]];
const DUPES = [["flag", "Only report them"], ["move", "Move extra copy to _Duplicates"]];
const sel = (opts, value, onchange, label) => h("select", { "aria-label": label, onchange: (e) => onchange(e.target.value) }, opts.map(([v, t]) => h("option", { value: String(v), selected: String(v) === String(value) }, t)));
const check = (value, onchange, label) => h("input", { type: "checkbox", checked: !!value, "aria-label": label, onchange: (e) => onchange(e.target.checked) });

function addFolder() {
  const o = { path: "", mode: "ask", organize_existing: true, care: "balanced", dupes: "flag", recursive: true };
  const path = h("input", { type: "text", placeholder: "Choose a folder…", readonly: true, "aria-label": "Folder" });
  const count = h("div", { style: "font-weight:600" }, "Choose a folder to see how many files it already contains.");
  const hint = h("div", { class: "muted", style: "font-size:12px;margin-top:4px" });
  const addBtn = h("button", { class: "primary" });
  let info = null;
  const radio = (value, title) => h("label", { style: "display:block;padding:2px 0" },
    h("input", { type: "radio", name: "existing", checked: o.organize_existing === value, onchange: () => { o.organize_existing = value; refresh(); } }), " " + title);
  function refresh() {
    hint.textContent = o.organize_existing
      ? (o.mode === "ask" ? "They will be analyzed now and listed under “Awaiting approval”. Nothing changes until you apply it."
                          : "They will be renamed right away. You can undo it from History.")
      : "Only files that arrive from now on are organized. You can organize the existing ones later from “Folder settings”.";
    addBtn.textContent = o.organize_existing ? "Add and organize" : "Add and start watching";
    if (info) count.textContent = info.files ? "This folder already contains " + plural(info.files, "file") + "." : "This folder is empty.";
  }
  async function loadInfo() {
    if (!o.path) return;
    try { info = await api("/fs/info?path=" + encodeURIComponent(o.path) + "&recursive=" + (o.recursive ? 1 : 0)); } catch (e) { info = null; }
    refresh();
  }
  addBtn.addEventListener("click", async () => {
    if (!o.path) { toast("Choose a folder first.", true); return; }
    const r = await act(() => api("/folders", "POST", o), o.organize_existing ? "Folder added. Analyzing the files already in it…" : "Folder added");
    if (r) { S.folder = r.id; S.view = "activity"; close(); render(); }
  });
  const form = h("div", { class: "form" },
    h("div", { class: "k" }, "Folder"), h("div", { class: "row2" }, path, h("button", { onclick: () => openPicker(o.path, (p) => { o.path = p; path.value = p; loadInfo(); }) }, "Browse…")),
    h("div", { class: "k" }, "Files already in it"), h("div", {}, count, radio(true, "Organize them now"), radio(false, "Leave them alone; only organize new files from now on"), hint),
    h("div", { class: "k" }, "New files"), sel(MODES, o.mode, (v) => { o.mode = v; refresh(); }, "New files"),
    h("div", { class: "k" }, "How careful"), sel(CARES, o.care, (v) => o.care = v, "Care"),
    h("div", { class: "k" }, "Exact copies"), sel(DUPES, o.dupes, (v) => o.dupes = v, "Duplicates"),
    h("div", { class: "k" }, "Subfolders"), h("label", {}, check(o.recursive, (v) => { o.recursive = v; loadInfo(); }, "Include subfolders"), " Include subfolders"));
  refresh();
  const close = modal("Add folder", form, (c) => [h("button", { onclick: c }, "Cancel"), addBtn]);
}
function openSettings() {
  const st = S.st; const theme = localStorage.getItem("theme") || "auto";
  const speeds = [[2, "Fast: every 2 seconds"], [5, "Normal: every 5 seconds"], [30, "Relaxed: every 30 seconds"], [300, "Battery saver: every 5 minutes"]];
  if (!speeds.some((s) => s[0] === st.interval)) speeds.push([st.interval, "Every " + st.interval + " seconds"]);
  const form = h("div", { class: "form" },
    h("div", { class: "k" }, "Start with computer"), h("label", {}, check(st.autostart, (v) => act(() => api("/settings", "POST", { autostart: v }), v ? "Will start at sign-in" : "Will not start at sign-in"), "Start with computer"), " Start when I sign in"),
    h("div", { class: "k" }, "Look for new files"), sel(speeds, st.interval, (v) => act(() => api("/settings", "POST", { interval: +v }), "Saved"), "Check speed"),
    h("div", { class: "k" }, "Quick access"), h("div", { class: "muted" }, { tray: "Tray icon, near the clock (on Windows it may be under the ^ arrow). Click it to open this dashboard.",
      window: "No tray on this system, so a small control window stays in your taskbar.",
      none: "No tray icon or window is available. Start File Organizer again to reopen the dashboard." }[st.access] || ""),
    h("div", { class: "k" }, "Appearance"), sel([["auto", "Match system"], ["light", "Light"], ["dark", "Dark"]], theme, (v) => { localStorage.setItem("theme", v); applyTheme(); }, "Theme"),
    h("div", { class: "k" }, "About"), h("div", { class: "muted" }, "Version " + VERSION + ". Nothing is ever deleted or overwritten; every batch can be undone."));
  modal("Settings", form, (close) => [h("button", { class: "danger", onclick: async () => { if (await confirmBox("Quit File Organizer?", "Monitoring stops until you start it again.", "Quit", true)) {
      try { await api("/quit", "POST", {}); } catch (e) {} document.body.replaceChildren(h("div", { class: "empty", style: "padding:20vh 24px" }, h("h2", {}, "File Organizer has stopped."), h("p", {}, "You can close this tab."))); } } }, "Quit File Organizer"),
    h("div", { style: "flex:1" }), h("button", { class: "primary", onclick: close }, "Close")]);
}

/* ---------- views ---------- */
function eventRow(e) {
  const f = e.file ? (e.to && e.to !== e.file ? [h("span", { class: "old" }, pathEl(e.file)), h("span", { class: "arrow" }, "→"), h("span", { class: "new" }, pathEl(e.to))] : pathEl(e.file)) : "";
  return h("tr", { class: S.flash.has(e.id) ? "flash" : "" },
    h("td", { class: "time" }, clock(e.ts)), h("td", {}, h("span", { class: "tag t-" + e.kind }, KIND[e.kind] || e.kind)),
    h("td", { title: e.folder || "" }, e.folder || ""), h("td", { class: "mono", title: (e.file || "") + (e.to ? " → " + e.to : "") }, f),

/* The status bar answers "what is it doing right now?" at all times. */
function paintStatus() {
  const st = S.st, bar = $("#status"); if (!st) return;
  const live = st.live || { phase: "idle" }; const active = st.folders.filter((f) => f.state === "watching");
  const lastScan = Math.max(0, ...st.folders.map((f) => f.last_scan || 0)); const nextCheck = Math.min(...active.map((f) => f.next_check || Infinity));
